name: "Monitoring Deploy (Ansible on VPC Runner)"

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [ self-hosted, monitoring ]

    steps:
      - uses: actions/checkout@v4

      - name: Inventory check
        shell: bash
        run: |
          set -euo pipefail
          cd ansible
          ansible-inventory -i aws_ec2.yml --graph | head -n 200

      - name: Deploy monitoring
        shell: bash
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook -i aws_ec2.yml deploy_monitoring.yml
