---
- name: Ensure repo directory exists
  file:
    path: "{{ repo_dir }}"
    state: directory
    mode: "0755"

# node_exporter는 보통 docker compose로 띄우는 편이 지금 구조에 맞음
- name: Start node_exporter via docker compose profile
  become_user: ubuntu
  shell: |
    set -e
    cd "{{ repo_dir }}"
    docker compose --profile node up -d --build
  args:
    executable: /bin/bash
