---
- name: Ensure repo directory exists
  file:
    path: "{{ repo_dir }}"
    state: directory
    mode: "0755"

- name: Start monitoring stack (grafana + prometheus) via docker compose profile
  become_user: ubuntu
  shell: |
    set -e
    cd "{{ repo_dir }}"
    docker compose --profile monitoring up -d --build
  args:
    executable: /bin/bash

# (선택) provisioning 리로드(재시작 없이 반영)
- name: Reload Grafana provisioning (optional)
  become_user: ubuntu
  shell: |
    curl -s -u admin:admin -X POST http://localhost:3000/api/admin/provisioning/datasources/reload || true
    curl -s -u admin:admin -X POST http://localhost:3000/api/admin/provisioning/dashboards/reload || true
  args:
    executable: /bin/bash
