global:
  scrape_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: "nodeapp"
    metrics_path: /metrics
    static_configs:
      - targets: ["test-node-app:8080"]


