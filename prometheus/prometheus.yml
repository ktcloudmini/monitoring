global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # -------------------------
  # node_exporter (CPU/MEM)
  # -------------------------
  - job_name: node
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        filters:
          - name: instance-state-name
            values: ["running"]

    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: $1:9100

      - source_labels: [__meta_ec2_instance_id]
        target_label: instance

  # -------------------------
  # node app metrics (8080)
  # -------------------------
  - job_name: nodeapp
    metrics_path: /metrics
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        filters:
          - name: instance-state-name
            values: ["running"]

    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: $1:8080

      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
